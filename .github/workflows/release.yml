name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的发布标签，例如 v1.0.0
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      # 托管 runner 的 TEMP 为 8.3 短路径，与 realpath 不一致，会触发路径校验。
      - if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run test:unit

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: 校验标签与版本一致
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version" || { echo "标签 $TAG 与 package.json 版本 $version 不一致"; exit 1; }
      - run: npm ci --include=dev
      # 下载并按固定摘要核验 Windows Node，生成全部发布资产。
      - run: npm run package
      - name: 提取本版更新日志
        run: |
          version=${TAG#v}
          awk -v v="$version" '$0 ~ "^## \[" v "\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release/NOTES.md
          test -s release/NOTES.md || echo "见 CHANGELOG.md" > release/NOTES.md
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release/NOTES.md $prerelease \
            release/*.zip release/*.tar.gz release/*.exe release/SHA256SUMS.txt
