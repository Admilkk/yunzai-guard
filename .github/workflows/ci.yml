name: CI

on:
  push:
    branches: [main, public, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm
      # 托管 runner 的 TEMP 为 8.3 短路径，与 realpath 不一致，会触发路径校验。
      - if: runner.os == 'Windows'
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # prepare 脚本会完成 runtime 与面板构建，并核验随包原生组件的摘要。
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - name: Linux plugin compatibility
        if: runner.os == 'Linux'
        shell: bash
        env:
          GUARD_TEST_LINUX_PLUGIN_COMPAT: "1"
          GUARD_TEST_LINUX_PLUGIN_DEPENDENCIES: ${{ runner.temp }}/guard-plugin-compat/package.json
        run: |
          npm install --prefix "$RUNNER_TEMP/guard-plugin-compat" --ignore-scripts --no-audit --no-fund systeminformation@5.31.6 puppeteer-core@24.22.0
          export GUARD_TEST_BROWSER="$(command -v google-chrome || command -v chromium)"
          test -n "$GUARD_TEST_BROWSER"
          node --test tests/linux-plugin-compatibility.test.mjs
